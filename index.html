<style>
  :root{
    --brand:#1f7a3d; --brand-strong:#145c2c; --gold:#ffe8a3;
    --wa:#25d366; --wa-strong:#128c4a;
    --f-display:'Rubik',system-ui,'Segoe UI',sans-serif;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{background:var(--brand-strong);color:#fff;font-family:var(--f-display);line-height:1.35;direction:rtl;-webkit-font-smoothing:antialiased}
  .hero{min-height:100vh;min-height:100dvh;display:flex;align-items:center;justify-content:center;background:linear-gradient(160deg,var(--brand-strong),var(--brand));position:relative;overflow:hidden;
    padding:24px max(22px,env(safe-area-inset-right,0px)) 24px max(22px,env(safe-area-inset-left,0px))}
  .hero::after{content:"";position:absolute;inset:0;background:radial-gradient(900px 320px at 80% -10%,rgba(255,255,255,.18),transparent 60%);pointer-events:none}
  .box{position:relative;z-index:1;width:100%;max-width:440px;text-align:center}
  .logo{display:block;width:150px;height:150px;margin:0 auto 26px;border-radius:50%;background:#fff;box-shadow:0 10px 28px rgba(0,0,0,.25)}
  .msg{font-size:1.5rem;font-weight:800;color:#fff}
  .timer{display:block;margin-top:18px;font-size:5.2rem;font-weight:800;line-height:1;color:var(--gold);font-variant-numeric:tabular-nums;direction:ltr}
  .bar{height:12px;border-radius:999px;background:rgba(255,255,255,.22);margin:24px auto 0;max-width:320px;overflow:hidden}
  .bar i{display:block;height:100%;width:100%;background:var(--gold);border-radius:999px;transform-origin:right center;transform:scaleX(0);animation:load 5s linear forwards}
  .loading{margin-top:10px;font-size:1rem;font-weight:500;letter-spacing:.04em;color:#d7efdd}
  .done .bar i{animation:none;transform:scaleX(1)}
  .done .timer,.done .loading{display:none}
  @keyframes load{from{transform:scaleX(0)}to{transform:scaleX(1)}}
  .cta{display:none;align-items:center;justify-content:center;gap:10px;margin-top:26px;background:var(--wa);color:#07210f;font-weight:700;font-size:1.15rem;text-decoration:none;padding:16px 22px;border-radius:14px;box-shadow:0 8px 20px rgba(37,211,102,.35)}
  .cta:active{transform:translateY(1px)}
  .cta svg{width:26px;height:26px;flex:none}
  .done .cta{display:flex}
</style>

</div>
<script>
(function(){
  var WA='https://chat.whatsapp.com/F6Srfn7L7xfGMh1yhtsisi';
  var box=document.getElementById('box'), timer=document.getElementById('timer'), msg=document.getElementById('msg');
  if(!box||!timer||!msg) return;
  var KEY='wa_redirected', already=false;
  try{ already=sessionStorage.getItem(KEY)==='1'; }catch(e){}
  /* מצב סיום: הטיימר נעלם ומופיע כפתור, למקרה שההעברה לא קרתה */
  function stop(text){ box.className='box done'; msg.textContent=text; }
  /* מי שכבר הועבר וחזר לדף לא מועבר שוב, כדי שלא ייתקע בלולאה */
  if(already){ stop('לא עברתם? לחצו על הכפתור'); return; }
  var n=5;
  var tick=setInterval(function(){
    n--;
    timer.textContent='0:0'+Math.max(n,0);
    if(n>0) return;
    clearInterval(tick);
    try{ sessionStorage.setItem(KEY,'1'); }catch(e){}
    stop('מעבירים אתכם לקבוצת ה-Whatsapp…');
    window.location.href=WA;
  },1000);
  window.addEventListener('pageshow',function(ev){
    if(ev.persisted){ clearInterval(tick); stop('לא עברתם? לחצו על הכפתור'); }
  });
})();
</script>
